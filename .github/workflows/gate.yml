name: gate
on: [push, pull_request]
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }                  # the measurement finds the commit that sealed its claims
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: the kernels - unit, edge and garbage suites
        run: node --test test/*.test.mjs
      - name: the mutation gate - every mutant of every kernel must be killed by its tests
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness6
          node tools/witness-check.mjs --kernels
          for k in text trace card stats judge cost breed years; do
            node /tmp/witness6/witness.mjs mutate src/$k.mjs --timeout 120000 --cap 600 --test node --test test/$k.test.mjs | tee /tmp/w.txt
            grep -q '"clean": true' /tmp/w.txt || { echo "::error::mutants survived in src/$k.mjs"; exit 1; }
            node tools/witness-check.mjs $k /tmp/w.txt || { echo "::error::src/$k.mjs's count differs from data/witness.json, which the page shows"; exit 1; }
          done
      - name: the vendored cost basis is the upstream file at its pinned commit, byte for byte
        run: |
          set -o pipefail
          test "$(node -p "require('./vendor/SOURCES.json').files.length")" -ge 1
          node -e "for (const f of require('./vendor/SOURCES.json').files) console.log([f.repo, f.commit, f.src, f.path].join(' '))" | while read repo commit src path; do
            curl -sfL "https://raw.githubusercontent.com/$repo/$commit/$src" -o /tmp/upstream
            cmp /tmp/upstream "$path" || { echo "::error::$path differs from $repo at $commit"; exit 1; }
            echo "$path is $repo/$src at $commit, byte for byte"
          done
      - name: the cards and the page's passages rebuild byte for byte from the committed texts and replies
        run: |
          node tools/cards.mjs --check
          node tools/drawn.mjs --check
      - name: organ 1 - once measured, the receipt is re-derived from the committed replies byte for byte
        run: |
          if [ -f receipts/organ-1.json ]; then node tools/measure-1.mjs --check; else echo "organ 1 sealed, being grown and measured"; fi
      - name: organ 1, read after the receipt (not sealed) - where the trace model sent every answer rebuilds byte for byte
        run: node tools/after-1.mjs --check
      - name: organ 2 - the children rebuild from the committed replies, and once measured the receipt re-derives byte for byte
        run: |
          if [ -f data/children.json ]; then node tools/breed.mjs --check; else echo "organ 2 sealed, being bred"; fi
          if [ -f receipts/organ-2.json ]; then node tools/measure-2.mjs --check; else echo "organ 2 not yet measured"; fi
